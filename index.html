    <script>
      // Gracefully prevent transient WebSocket disconnects from surfacing in iframe overlays
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (String(e.reason).includes('WebSocket') || String(e.reason).includes('ws:'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        if (e && (String(e.message).includes('WebSocket') || String(e.message).includes('closed without opened'))) {
          e.preventDefault();
        }
      });
    </script>
